name: Publicar documentación en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build MkDocs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Debe ejecutarse ANTES del build: expone base_url/base_path reales de Pages.
      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Generar páginas de datos simulados
        run: python scripts/generate_data_page.py

      - name: Construir sitio
        env:
          MKDOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          echo "MkDocs site_url: ${MKDOCS_SITE_URL}"
          mkdocs build --strict

      - name: Verificar rutas de assets en Templates
        run: |
          echo "HTML generados:"
          find site/templates -maxdepth 1 -type f -name '*.html' -print | sort || true
          echo
          echo "CSS referenciado por Intake:"
          grep -oE 'href="[^"]*assets/stylesheets/[^"]+"' site/templates/ai-use-case-intake.html | head -5 || true
          echo
          echo "JS referenciado por Intake:"
          grep -oE 'src="[^"]*assets/javascripts/[^"]+"' site/templates/ai-use-case-intake.html | head -5 || true

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
