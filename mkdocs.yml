site_name: Gobierno de IA Fintech Lite
site_description: Framework agile y mínimo viable de Gobierno de IA para fintech regulada
# GitHub Pages publica este repositorio bajo /arquitectura-gobierno-IA/.
# En CI, MKDOCS_SITE_URL se obtiene automáticamente desde actions/configure-pages.
site_url: !ENV [MKDOCS_SITE_URL, 'https://edgarrth.github.io/arquitectura-gobierno-IA/']
repo_url: https://github.com/edgarrth/arquitectura-gobierno-IA
repo_name: edgarrth/arquitectura-gobierno-IA
docs_dir: docs
site_dir: site
use_directory_urls: false

nav:
  - Inicio: index.md
  - Implementación 90 días: 00-implementacion/guia-90-dias.md
  - Gobierno:
      - Política y charter: 01-gobierno/politica-y-charter-ia-lite.md
      - Modelo operativo y RACI: 01-gobierno/modelo-operativo-raci.md
      - Intake y portfolio: 01-gobierno/intake-y-portfolio.md
  - Riesgo y controles:
      - Clasificación y controles: 02-riesgo-controles/clasificacion-riesgo-y-controles.md
      - Mapeo de estándares: 02-riesgo-controles/mapeo-estandares.md
  - Data, modelos y GenAI:
      - Data y Model Governance: 03-data-model-genai/data-model-governance.md
      - GenAI, RAG y agentes: 03-data-model-genai/genai-rag-agent-governance.md
  - Operación y auditoría:
      - Seguridad, ModelOps y evidencias: 04-operacion-auditoria/seguridad-modelops-evidencias.md
      - KPIs y dashboard: 04-operacion-auditoria/kpis-y-dashboard.md
  - Templates:
      - Inicio: templates/index.md
      - Intake: templates/ai-use-case-intake.md
      - Risk Assessment: templates/ai-risk-assessment.md
      - Model Card Lite: templates/model-card-lite.md
      - Exception Request: templates/exception-request.md
  - Recursos:
      - Diagramas: diagramas.md
      - Datos simulados: datos-simulados.md

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: es

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
